# Package-local defaults. Workspace run.sh may overwrite vehicle_spec keys.
network_launch:
  # 1: same-PC. 2: remote-PC.
  launch_option: 2
  open_ufw_for_remote: true
  same_pc:
    bridge_ip: 127.0.0.1
    simulator_ip: 192.168.0.8
  remote_pc:
    # Set these to the wired-LAN addresses before using option 2/fallback.
    bridge_ip: "192.168.0.20"
    simulator_ip: "192.168.0.1"
    prefix_length: 24

bind_ip: 0.0.0.0
allowed_source_ip: ""
receive_buffer_bytes: 4194304
recv_error_reopen_threshold: 3
high_hz_diagnostics_topic: /diagnostics/high_hz

cameras:
  front:
    port: 9291
    packet_layout: timestamped
    topic: /image/front/compressed
    camera_info_topic: /image/front/camera_info
    stale_timeout: 0.5
  left:
    port: 9293
    packet_layout: timestamped
    topic: /image/left/compressed
    camera_info_topic: /image/left/camera_info
    stale_timeout: 0.5
  right:
    port: 9295
    packet_layout: timestamped
    topic: /image/right/compressed
    camera_info_topic: /image/right/camera_info
    stale_timeout: 0.5

gps:
  enabled: true
  port: 9301
  topic: /sensors/gps/fix
  stale_timeout: 1.0

imu:
  enabled: true
  port: 9999
  packet_layout: timestamped
  topic: /sensors/imu/data
  stale_timeout: 0.5

status:
  enabled: true
  port: 9099
  topic: /vehicle/competition_status
  stale_timeout: 0.25

control:
  command_topic: /morai_udp_bridge/control_cmd
  destination_ip: 127.0.0.1
  destination_port: 9093
  send_rate_hz: 50.0
  command_timeout_sec: 0.25
  safe_brake_command: 1.0
  send_error_reopen_threshold: 3

lamp_control:
  enabled: false
  command_topic: /morai_udp_bridge/lamp_cmd
  destination_ip: 127.0.0.1
  # Set the MORAI Network Settings Lamp Control port before enabling.
  destination_port: 0
  send_error_reopen_threshold: 3
